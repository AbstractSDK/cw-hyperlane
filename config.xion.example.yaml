networks:
  - id: 'xion-testnet-2'
    # Human-readable part for XION addresses
    hrp: 'xion'
    # IMPORTANT: Replace with your private key or mnemonic for the XION testnet.
    signer: {cosmos_private_key}
    endpoint:
      rpc: 'https://rpc.xion-testnet-2.burnt.com:443'
      rest: 'https://api.xion-testnet-2.burnt.com'
      grpc: 'grpc.xion-testnet-2.burnt.com:443'
    gas:
      # Adjust if needed
      price: '0.025'
      denom: 'uxion'
    # TODO: figure out The domain ID for xion-testnet-2.
    domain: 1355

# Networks that already have hyperlane deployments
# but might require new warp route connections
evm_networks:
  - name: 'alfajores'
    # IMPORTANT: Replace with your private key for the Celo Alfajores testnet.
    signer: {evm_private_key}
    chain_id: 44787
    rpc_endpoint: 'https://alfajores-forno.celo-testnet.org/'
    network: 'alfajores'
    nativeCurrency:
      name: 'Celo Alfajores'
      symbol: 'CELO'
      decimals: 18
    mailbox_address: '0xEf9F292fcEBC3848bF4bB92a96a04F9ECBb78E59'
    # See https://github.com/hyperlane-xyz/hyperlane-registry/blob/main/chains/alfajores/addresses.yaml
    multisig_ism_factory_address: '0xC1b8c0e56D6a34940Ee2B86172450B54AFd633A7'

